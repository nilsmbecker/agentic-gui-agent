[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gui-agent"
version = "0.1.0"
description = "GELab-Zero GUI agent on AndroidWorld - Agentic AI in Business (TUM)"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pillow",
  # imported by third_party/gelab-zero/copilot_tools/parser_0920_summary.py
  "jsonlines",
  "megfile",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["third_party", "course", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
