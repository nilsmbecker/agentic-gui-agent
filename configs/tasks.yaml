# AndroidWorld tasks we evaluate: one per difficulty tier, 3 runs each, a screen recording per run.
# `primary` = the task we ran for the evaluation.
# `backup`  = alternatives from the same tier, in case a primary task is broken on the emulator.
# complexity = AndroidWorld's own difficulty score (max steps default = 10 x complexity).

tiers:
  warm_up:          # 2-5 steps
    description: single app, few steps, state is directly checkable
    primary: SystemWifiTurnOn           # settings, complexity 1.0
    backup: [ClockTimerEntry, SystemCopyToClipboard, ContactsAddContact]

  real_work:        # 6-20 steps
    description: one app, form filling / text entry, several screens
    primary: MarkorCreateNote           # markor, 1.6
    backup: [SimpleSmsSend, FilesMoveFile, SimpleCalendarAddOneEvent]

  multi_app_memory: # 9-60 steps
    description: carry a value from one app into another (tests lost_value / wrong_app)
    primary: MarkorCreateNoteAndSms     # markor + simple sms messenger, 1.8
    backup: [BrowserMultiply, ExpenseAddMultipleFromMarkor]

runs_per_task: 3
seed: 0   # run i uses seed+i -> every team member gets identical task parameters
